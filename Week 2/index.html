<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071b20">
    <title>Week 2｜網頁小測驗</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            color: #eef8f7;
            background: #071b20;
            font-synthesis: none;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(12, 104, 93, 0.3), transparent 38%),
                radial-gradient(ellipse at 90% 85%, rgba(17, 83, 106, 0.28), transparent 36%),
                #071b20;
        }

        button {
            font: inherit;
        }

        .quiz {
            width: min(100%, 680px);
            padding: clamp(24px, 6vw, 48px);
            border: 1px solid rgba(98, 239, 213, 0.32);
            border-radius: 28px;
            background: rgba(11, 34, 39, 0.92);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34), 0 0 36px rgba(5, 230, 197, 0.08);
        }

        .topline,
        .question-meta,
        .result-score {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .week-label {
            color: #73ead6;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .pill {
            padding: 7px 12px;
            border: 1px solid rgba(115, 234, 214, 0.28);
            border-radius: 999px;
            color: #b7d8d5;
            font-size: 0.8rem;
        }

        h1 {
            margin: 24px 0 8px;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: 0.02em;
        }

        .intro {
            margin: 0;
            color: #a9c1c0;
            line-height: 1.8;
        }

        .progress-wrap {
            margin: 30px 0 28px;
        }

        .progress-track {
            height: 7px;
            overflow: hidden;
            border-radius: 999px;
            background: #1b383b;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #05c9a9, #8af0dc);
            transition: width 240ms ease;
        }

        .question-meta {
            margin-bottom: 14px;
            color: #83dccc;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .question {
            margin: 0 0 24px;
            font-size: clamp(1.2rem, 4vw, 1.55rem);
            line-height: 1.65;
        }

        .choices {
            display: grid;
            gap: 12px;
        }

        .choice {
            width: 100%;
            padding: 15px 17px;
            border: 1px solid #315054;
            border-radius: 14px;
            background: #102b30;
            color: #e7f2f1;
            text-align: left;
            cursor: pointer;
            transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
        }

        .choice:not(:disabled):hover {
            transform: translateY(-2px);
            border-color: #67dfcb;
            background: #15383b;
        }

        .choice:focus-visible,
        .action:focus-visible {
            outline: 3px solid #9af4e4;
            outline-offset: 3px;
        }

        .choice:disabled {
            cursor: default;
        }

        .choice.is-correct {
            border-color: #4de0ae;
            background: rgba(30, 119, 88, 0.32);
        }

        .choice.is-wrong {
            border-color: #ff9a89;
            background: rgba(140, 55, 53, 0.3);
        }

        .feedback {
            min-height: 24px;
            margin: 18px 0 0;
            color: #bed4d2;
            line-height: 1.7;
        }

        .feedback strong {
            display: block;
            margin-bottom: 5px;
            color: #80ecd5;
        }

        .feedback.is-wrong strong {
            color: #ffad9e;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .action {
            min-height: 48px;
            padding: 11px 20px;
            border: 0;
            border-radius: 12px;
            background: #70ead4;
            color: #06231f;
            font-weight: 800;
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease;
        }

        .action:hover {
            transform: translateY(-2px);
            background: #9af4e4;
        }

        .action:disabled {
            background: #355451;
            color: #91aaa7;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            padding: 16px 0 4px;
            text-align: center;
        }

        .result-icon {
            font-size: 3rem;
        }

        .result h2 {
            margin: 12px 0 8px;
            font-size: 1.8rem;
        }

        .result-score {
            justify-content: center;
            margin: 24px 0;
            color: #b5cecb;
        }

        .result-score strong {
            color: #81efd9;
            font-size: 1.35rem;
        }

        .result .action {
            width: 100%;
            margin-top: 8px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }

            .quiz {
                border-radius: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="quiz">
        <div class="topline">
            <span class="week-label">WEEK 2 · INTERACTIVE</span>
            <span class="pill">HTML 入門</span>
        </div>
        <h1>網頁小測驗</h1>
        <p class="intro">選出你的答案，看看自己對網頁基礎了解多少！</p>

        <section id="quiz-panel" aria-label="測驗題目">
            <div class="progress-wrap">
                <div class="question-meta">
                    <span id="question-count">正在載入題目…</span>
                    <span id="score-count">目前答對 0 題</span>
                </div>
                <div
                    class="progress-track"
                    id="progress-track"
                    role="progressbar"
                    aria-label="測驗進度"
                    aria-valuemin="0"
                    aria-valuemax="0"
                    aria-valuenow="0"
                >
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <h2 class="question" id="question-text" tabindex="-1"></h2>
            <div class="choices" id="choices" aria-label="答案選項"></div>
            <div class="feedback" id="feedback" aria-live="polite"></div>
            <div class="actions">
                <button class="action" id="next-button" type="button" disabled>查看解析</button>
            </div>
        </section>

        <section class="result" id="result-panel" aria-live="polite" hidden>
            <div class="result-icon" aria-hidden="true">🎉</div>
            <h2 id="result-title">測驗完成！</h2>
            <p class="intro" id="result-message"></p>
            <div class="result-score">
                <span>你的成績：</span>
                <strong id="final-score"></strong>
            </div>
            <button class="action" id="restart-button" type="button">再玩一次</button>
        </section>
    </main>

    <script>
        // 編輯這裡的題目、選項、正確答案索引與解析即可換成自己的題目。
        const questions = [
            {
                question: "在前端開發中，若要建立一個按鈕並設定其呈現的顏色外觀，這兩個需求分別屬於哪些技術的核心職責？",
                choices: [
                    "HTML 負責定義點擊觸發的動作，CSS 負責建立按鈕元素",
                    "HTML 負責在頁面上建立按鈕元素，CSS 負責美化並設定按鈕的外觀顏色",
                    "JavaScript 負責建立按鈕元素，HTML 負責調整按鈕的外觀顏色",
                    "CSS 負責建立按鈕元素，JavaScript 負責設定按鈕的外觀顏色"
                ],
                answer: 1,
                explanation: "HTML 負責建立網頁內容與結構，CSS 負責外觀樣式，JavaScript 則負責互動行為。"
            },
            {
                question: "下列哪一種寫在 HTML 檔裡面的內容，會被瀏覽器讀取並呈現於網頁的可視畫面上？",
                choices: [
                    "寫在 <body> 標籤內的 <p> 段落文字",
                    "寫在 <head> 標籤內部的 <title> 網頁標題設定",
                    "寫在 <!-- 與 --> 註解符號之間的說明文字",
                    '寫在 <head> 標籤內部的 <meta charset="UTF-8"> 設定'
                ],
                answer: 0,
                explanation: "網頁瀏覽器僅會將寫在<body>標籤內的內容呈現於畫面上，其他寫在<head>裡的設定或註解文字不會顯示。"
            },
            {
                question: "在圖片標籤中，哪個屬性能提供圖片的文字替代說明？",
                choices: ["src", "href", "alt", "title"],
                answer: 2,
                explanation: "alt 屬性用來提供圖片的文字替代說明。"
            },
            {
                question: "在 VS Code 編輯器中，若希望透過內建的 Emmet 功能瞬間產生標準 HTML5 文件的完整骨架，應該輸入什麼符號並按下 Tab 鍵？",
                choices: ["!", "@", "#", "html"],
                answer: 0,
                explanation: "在 VS Code 中輸入驚嘆號 ! 並按下 Tab 鍵，會觸發 Emmet 自動補全並產生 HTML5 文件骨架。"
            },
            {
                question: "在編寫文章時，若想將句子中的某幾個字標記為需要特別強調的「重要資訊」，最符合語意化且適當的標籤是哪一個？",
                choices: ["<strong>", "<em>", "<h1>", "<br>"],
                answer: 0,
                explanation: "<strong> 標籤用於表示句中或段落中具有高度重要性、需要強調的關鍵字句，通常會以粗體顯示。"
            },
            {
                question: "符合 HTML 標籤巢狀（Nesting）結構「先開啟者後關閉」原則的程式碼片段為何？",
                choices: ["<p>請閱讀<strong>注意事項</strong></p>", "<p>請閱讀<strong>注意事項</p></strong>", "<p>請閱讀注意事項</p></strong>", "<strong><p>請閱讀注意事項</strong></p>"],
                answer: 0,
                explanation: "HTML 標籤必須按照「先開啟者後關閉」的原則進行巢狀結構的撰寫。"
            },
            {
                question: '在標籤 <a href="https://youtube.com" target="_blank"> 中，加入 target="_blank" 屬性會對使用者的點擊行為產生什麼影響？',
                choices: ["在新分頁中開啟連結", "在原分頁中開啟連結", "下載連結指向的文件", "不產生任何影響"],
                answer: 0,
                explanation: 'target="_blank" 屬性會讓連結在新的瀏覽器分頁中開啟。'
            },
            {
                question: "若開啟剛寫好的 HTML 檔案時發現網頁中的中文文字全都變成無法閱讀的亂碼，最可能是因為 HTML 文件中遺漏了哪一項設定？",
                choices: [
                    'target="_blank"',
                    '<meta charset="UTF-8">',
                    "<hr>",
                    "<title>建立網頁標題</title>"
                ],
                answer: 1,
                explanation: "指定UTF-8編碼格式，確保瀏覽器以正確的編碼表解析中文字元，能正確顯示，防止亂碼發生。"
            },
            {
                question: "在 VS Code 中使用 Live Server 延伸模組開發網頁時，每當存檔（Ctrl+S）後會發生下列哪種情況？",
                choices: ["網頁自動重新載入", "網頁關閉並重新開啟", "網頁顯示錯誤訊息", "網頁變更不會生效"],
                answer: 0,
                explanation: "使用 Live Server 時，存檔後網頁會自動重新載入，以顯示最新的更改。"
            },
            {
                question: "關於 HTML 標題標籤 `<h1>` 至 `<h6>` 的使用原則與特性，下列哪個敘述是正確的？",
                choices: [
                    "h6代表的是全頁最高層級且字體最大的標題",
                    "一個 HTML 檔案中僅能出現 h1 標籤，絕對不能使用 h2 以下的標籤",
                    "標題的字體大小h6最大，h1最小，且標題的層級與字體大小無關",
                    "h1到h6主要用來表示標題的結構層級與重要程度。"
                ],
                answer: 3,
                explanation: "h1到h6標題標籤用來表示網頁中不同層級的標題，h1是最高層級，h6是最低層級。"
            }
        ];

        const quizPanel = document.querySelector("#quiz-panel");
        const resultPanel = document.querySelector("#result-panel");
        const questionCount = document.querySelector("#question-count");
        const scoreCount = document.querySelector("#score-count");
        const progressTrack = document.querySelector("#progress-track");
        const progressBar = document.querySelector("#progress-bar");
        const questionText = document.querySelector("#question-text");
        const choicesContainer = document.querySelector("#choices");
        const feedback = document.querySelector("#feedback");
        const nextButton = document.querySelector("#next-button");
        const restartButton = document.querySelector("#restart-button");

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        function renderQuestion() {
            const item = questions[currentQuestion];
            questionCount.textContent = `第 ${currentQuestion + 1} 題，共 ${questions.length} 題`;
            scoreCount.textContent = `目前答對 ${score} 題`;
            progressTrack.setAttribute("aria-valuemax", questions.length);
            progressTrack.setAttribute("aria-valuenow", currentQuestion);
            progressBar.style.width = `${(currentQuestion / questions.length) * 100}%`;
            questionText.textContent = item.question;
            feedback.className = "feedback";
            feedback.replaceChildren();
            nextButton.disabled = true;
            nextButton.textContent = "查看解析";
            answered = false;

            choicesContainer.replaceChildren();
            item.choices.forEach((choice, index) => {
                const button = document.createElement("button");
                button.className = "choice";
                button.type = "button";
                button.textContent = choice;
                button.addEventListener("click", () => selectAnswer(index));
                choicesContainer.append(button);
            });
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;
            answered = true;

            const item = questions[currentQuestion];
            const isCorrect = selectedIndex === item.answer;
            if (isCorrect) score += 1;
            scoreCount.textContent = `目前答對 ${score} 題`;

            [...choicesContainer.children].forEach((button, index) => {
                button.disabled = true;
                if (index === item.answer) button.classList.add("is-correct");
                if (index === selectedIndex && !isCorrect) button.classList.add("is-wrong");
            });

            const heading = document.createElement("strong");
            heading.textContent = isCorrect ? "答對了！" : "再記一下正確答案";
            feedback.classList.toggle("is-wrong", !isCorrect);
            feedback.append(heading, document.createTextNode(item.explanation));
            nextButton.disabled = false;
            nextButton.textContent = currentQuestion === questions.length - 1 ? "看測驗結果" : "下一題";
        }

        function showResult() {
            quizPanel.hidden = true;
            resultPanel.hidden = false;
            progressBar.style.width = "100%";
            document.querySelector("#final-score").textContent = `${score} / ${questions.length} 題`;

            const percentage = score / questions.length;
            const title = document.querySelector("#result-title");
            const message = document.querySelector("#result-message");
            if (percentage === 1) {
                title.textContent = "全部答對，太厲害了！";
                message.textContent = "你已經掌握這些網頁基礎概念。";
            } else if (percentage >= 0.6) {
                title.textContent = "做得不錯！";
                message.textContent = "再複習一下解析，就會更熟悉囉。";
            } else {
                title.textContent = "完成挑戰！";
                message.textContent = "別擔心，重新玩一次就能記得更多。";
            }
            restartButton.focus();
        }

        nextButton.addEventListener("click", () => {
            if (!answered) return;
            if (currentQuestion === questions.length - 1) {
                showResult();
                return;
            }
            currentQuestion += 1;
            renderQuestion();
            questionText.focus();
        });

        restartButton.addEventListener("click", () => {
            currentQuestion = 0;
            score = 0;
            resultPanel.hidden = true;
            quizPanel.hidden = false;
            renderQuestion();
            choicesContainer.querySelector("button").focus();
        });

        renderQuestion();
    </script>
</body>
</html>
